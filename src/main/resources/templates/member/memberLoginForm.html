<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/layout1}" class="memberLoginForm">

<head>
  <link th:href="@{/css/member.css}" rel="stylesheet">
</head>

<div layout:fragment="content">

  <form role="form" method="post" action="/members/login">
    <div class="form-group">
      <label th:for="email">이메일주소</label>
      <input type="email" name="email" class="form-control" placeholder="이메일을 입력해주세요">
    </div>
    <div class="form-group">
      <label th:for="password">비밀번호</label>
      <input type="password" name="password" id="password" class="form-control" placeholder="비밀번호 입력">
    </div>
    <p th:if="${loginErrorMsg}" class="error" th:text="${loginErrorMsg}"></p>
    <button class="btn btn-primary">로그인</button>
    <button type="button" class="btn btn-primary" onClick="location.href='/members/new'">회원가입</button>
    <button type="button" class="btn btn-info" onClick="location.href='/members/findEmail'">아이디 찾기</button>
    <button type="button" class="btn btn-success" onClick="location.href='/members/findPw'">비밀번호 찾기</button>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  </form>

  <a href="/oauth2/authorization/google"><img th:src="@{/icon/google.svg}" style="width:165px; height:37.5px;"></a>
  <a href="/oauth2/authorization/naver"><img th:src="@{/icon/naver.png}" style="width:150px; height:37.5px;"></a>
  <a href="/oauth2/authorization/kakao"><img th:src="@{/icon/kakao.png}" style="width:150px; height:37.5px;"></a>

</div>

</html>
