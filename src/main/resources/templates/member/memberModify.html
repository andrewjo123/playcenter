<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">

<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
    <style>
        .fieldError {
            color: #bd2130;
        }
    </style>
</th:block>

<!-- 사용자 스크립트 추가 -->
<th:block layout:fragment="script">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script th:inline="javascript">
        function getAddr(){
            new daum.Postcode({
                oncomplete: function(data) {
                    // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                    // 도로명 주소의 노출 규칙에 따라 주소를 조합한다.
                    // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                    var fullRoadAddr = data.roadAddress; // 도로명 주소 변수
                    var extraRoadAddr = ''; // 도로명 조합형 주소 변수

                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraRoadAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                       extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 도로명, 지번 조합형 주소가 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if(extraRoadAddr !== ''){
                        extraRoadAddr = ' (' + extraRoadAddr + ')';
                    }
                    // 도로명, 지번 주소의 유무에 따라 해당 조합형 주소를 추가한다.
                    if(fullRoadAddr !== ''){
                        fullRoadAddr += extraRoadAddr;
                    }
                    $("input[id='getAddressNum']").val(data.zonecode);
                    $("input[id='getAddress']").val(fullRoadAddr);
                }
            }).open();
        }
        function anotherCheck() {
            var pwd=$("#pwd").val();
            var checkPwd=$("#checkPwd").val();

		    if (pwd != checkPwd) {
		       alert("비밀번호가 일치하지 않습니다.");
		       $("#checkPwd").focus();
		       return false;
		    }
		    <!-- 위치 수정 필요 -->
		    alert("회원정보가 변경되었습니다");
		    return true;
		 }
        $(document).ready(function(){
            var errorMessage = [[${errorMessage}]];
            if(errorMessage != null){
                alert(errorMessage);
            }
        });
    </script>

</th:block>

<div layout:fragment="content">

    <form action="/members/modify" role="form" method="post"  th:object="${memberFormDto}">
        <div class="form-group">
            <label th:for="name">이름</label>
            <input type="text" th:field="*{name}" class="form-control" readonly>
            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError">Incorrect data</p>
        </div>
        <div class="form-group">
            <label th:for="email">이메일주소</label>
            <input type="email" th:field="*{email}" class="form-control" readonly>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError">Incorrect data</p>
        </div>
        <div class="form-group">
            <label th:for="password">비밀번호</label>
            <input id="pwd" type="password" th:field="*{password}" class="form-control" placeholder="비밀번호를 입력해주세요" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[$@$!%*#?&])[A-Za-z\d$@$!%*#?&]{8,16}$" required title="8~16글자 사이의 영어, 숫자, 특수문자를 모두 사용해서 입력해주세요." autocomplete="new-password">
        </div>
        <div class="form-group">
            <label th:for="checkPassword">비밀번호 재입력</label>
            <input id="checkPwd" type="password" class="form-control" placeholder="비밀번호를 다시 입력해주세요" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[$@$!%*#?&])[A-Za-z\d$@$!%*#?&]{8,16}$" required title="8~16글자 사이의 영어, 숫자, 특수문자를 모두 사용해서 입력해주세요." autocomplete="new-password">
        </div>
        <div class="form-group">
            <label th:for="phone">전화번호</label>
            <input type="tel" th:field="*{phone}" class="form-control" placeholder="전화번호를 입력해주세요" pattern="\d{2,3}-\d{3,4}-\d{4}" required title="000-0000-0000 형식으로 입력해주세요.">
        </div>
        <div class="form-group">
            <label th:for="address">주소</label>
            <input id="getAddressNum" type="text" th:field="*{addressCode}" class="form-control" placeholder="우편번호" style="width:200px;display:inline;" required>
            <button type="button" class="btn btn-info" onclick="getAddr();" style="width:150px; ">우편번호 검색</button>
            <input id="getAddress" type="text" th:field="*{address}" class="form-control" placeholder="주소를 입력해주세요" required>
            <input type="text" th:field="*{addressDetail}" class="form-control" placeholder="상세 주소를 입력해주세요">
        </div>
        <div style="text-align: center">
            <button type="submit" class="btn btn-primary" onclick="return anotherCheck()">회원정보 수정</button>
            <button type="button" class="btn btn-danger">회원탈퇴</button>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

</div>

</html>
