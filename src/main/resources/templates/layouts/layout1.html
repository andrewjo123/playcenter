<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- CSS only -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link th:href="@{/css/layout1.css}" rel="stylesheet">
    <link th:href="@{/css/fragments.css}" rel="stylesheet">
    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <script>
        function cartCount(){
            var exist=$("#ppEmail").text();
            console.log(exist+"123");
            if(exist!=""&&exist!=null){
                console.log("1차");
                $.ajax({
                    url:'/cartCount',
                    type:"GET",
                    data:{email:exist},
                    dataType:"text",
                    success:function(result){
                        console.log("2차");
                        if(result>0){
                            console.log("3차");
                            $("#getCount").text(result);
                        }
                    }
                });
            }
        }

        $(document).ready(function(){
            cartCount();
            const currentUrl = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');

            navLinks.forEach(link => {
                const linkUrl = link.getAttribute('href');

                // 현재 URL이 링크 URL로 시작하는지 확인
                if (currentUrl === linkUrl || currentUrl.startsWith(linkUrl)) {
                 link.classList.add('active');
                 console.log(`Active class added to: ${linkUrl}`);
                }
            });
        });
    </script>

    <th:block layout:fragment="script"></th:block>
    <th:block layout:fragment="css"></th:block>
    <th:block layout:fragment="img"></th:block>

</head>

<body>
<div th:replace="~{fragments/header1::header1}"></div>

<div th:replace="~{fragments/header::header}"></div>

<div layout:fragment="content" class="content">

</div>

<!--    <div th:replace="~{fragments/footer::footer}"></div>-->
<div><p><a href="/support">지원 페이지로 가기</a></p></div>
</body>

</html>
