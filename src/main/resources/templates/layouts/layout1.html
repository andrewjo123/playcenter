<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- CSS only -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link th:href="@{/css/layout1.css}" rel="stylesheet">
    <link th:href="@{/css/fragments.css}" rel="stylesheet">
    <!-- JS, Popper.js, and jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        function cartCount(){
            var exist=$("#ppEmail").text();
            if(exist!=""&&exist!=null){
                $.ajax({
                    url:'/cartCount',
                    type:"GET",
                    data:{email:exist},
                    dataType:"text",
                    success:function(result){
                        if(result>0){
                            $("#getCount").text(`(${result})`).show();
                            $("#sidebarGetCount").text(result).show();
                        } else {
                            $("#getCount").hide();
                            $("#sidebarGetCount").hide();
                        }
                    }
                });
            }
        }

        function dibsCount(){
            var exist=$("#ppEmail").text();
            if(exist!=""&&exist!=null){
                $.ajax({
                    url:'/dibsCount',
                    type:"GET",
                    data:{email:exist},
                    dataType:"text",
                    success:function(result){
                        if(result>0){
                            $("#getCountDibs").text(`(${result})`).show();
                            $("#sidebarGetCountDibs").text(result).show();
                        } else {
                            $("#getCountDibs").hide();
                            $("sidebarGetCountDibs").hide();
                        }
                    }
                });
            }
        }


        $(document).ready(function(){
            cartCount();
            dibsCount();
            const currentUrl = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link,.btn.company');

            navLinks.forEach(link => {
                const linkUrl = link.getAttribute('href');

                // 현재 URL이 링크 URL로 시작하는지 확인
                if (currentUrl === linkUrl || currentUrl.startsWith(linkUrl)) {
                 link.classList.add('active');
                 console.log(`Active class added to: ${linkUrl}`);
                }
            });
        });

        $(".company").on('click', function() {
        var company = $(this).data('company');
        
    });
    </script>

    <th:block layout:fragment="script"></th:block>
    <th:block layout:fragment="css"></th:block>
    <th:block layout:fragment="img"></th:block>

</head>

<body>
<div th:replace="~{fragments/header1::header1}"></div>



<div class="container-fluid">
    <div class="row">
        <div class="col-md-11">
            <div layout:fragment="content" class="content"></div>
        </div>

        <div class="col-md-1">
            <div th:replace="~{fragments/sidebar::sidebar}"></div>
        </div>
    </div>
</div>



<!--    <div th:replace="~{fragments/footer::footer}"></div>-->
<div><p><a href="/support">지원 페이지로 가기</a></p></div>
</body>

</html>
