<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}" class="itemDtl">

<head>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link th:href="@{/css/shop.css}" rel="stylesheet">
    <!-- Font Awesome 링크 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<div layout:fragment="content">

    <input type="hidden" id="itemId" th:value="${item.id}">

    <div class="d-flex itemdtl">
        <div class="repImgDiv">
            <img th:src="${item.itemImgDtoList[0].imgUrl}" class="rounded repImg" th:alt="${item.itemNm}">
        </div>
        <div class="wd50">
            <span th:if="${item.itemSellStatus == T(com.playground.constant.ItemSellStatus).SELL}"
                  class="badge badge-primary mgb-15">판매중</span>
            <span th:unless="${item.itemSellStatus == T(com.playground.constant.ItemSellStatus).SELL}"
                  class="badge btn-danger mgb-15">품절</span>
            <div class="h4" th:text="${item.itemNm}"></div>
            <hr class="my-4">

            <div class="text-right">
                <div class="h4 text-danger text-left">
                    <input type="hidden" th:value="${item.price}" id="price" name="price">
                    <span th:text="${item.price}"></span>원
                </div>
                <div class="input-group w-50">
                    <div class="input-group-prepend">
                        <span class="input-group-text">수량</span>
                    </div>
                    <input type="number" name="count" id="count" class="form-control" value="1" min="1">
                </div>
            </div>
            <hr class="my-4">

            <div class="text-right mgt-50">
                <h5>결제 금액</h5>
                <h3 name="totalPrice" id="totalPrice" class="font-weight-bold"></h3>
            </div>
            <div th:if="${item.itemSellStatus == T(com.playground.constant.ItemSellStatus).SELL}" class="text-right">
                <button type="button" class="btn btn-light border border-primary btn-lg" onclick="addCart()">장바구니
                    담기</button>
                <button type="button" class="btn btn-primary btn-lg" onclick="order()">주문하기</button>
            </div>
            <div th:unless="${item.itemSellStatus == T(com.playground.constant.ItemSellStatus).SELL}" class="text-right">
                <button type="button" class="btn btn-danger btn-lg no-cursor">품절</button>
            </div>
        </div>
    </div>

    <div class="jumbotron jumbotron-fluid mgt-30 itemdtl">
        <div><span class="dtlinfo">플랫폼:</span> <span th:text="${item.company}"></span></div>
        <div><span class="dtlinfo">장르:</span> <span th:text="${item.tag}"></span></div>
        <div>
            별점:
            <span th:if="${item.avg == 0}">평점 없음</span>
            <span th:if="${item.avg > 0}">
                <span th:text="${#numbers.formatDecimal(item.avg, 1, 1)}"></span>
                <span th:each="i : ${#numbers.sequence(1, item.avg)}"><i class="fas fa-star"></i></span>
                <span th:each="i : ${#numbers.sequence(item.avg + 1, 5)}"><i class="far fa-star"></i></span>
            </span>
        </div>
        <div>리뷰수: <span th:text="${item.allReview}"></span></div>
        <div class="container">
            <h4 class="display-5">상품 상세 설명</h4>
            <hr class="my-4">
            <p class="lead" th:text="${item.itemDetail}"></p>
        </div>
    </div>

    <div th:each="itemImg : ${item.itemImgDtoList}" class="text-center">
        <img th:if="${not #strings.isEmpty(itemImg.imgUrl)}" th:src="${itemImg.imgUrl}" class="rounded mgb-15" width="800">
    </div>

    <!-- 리뷰 등록 버튼 -->
    <button type="button" class="btn btn-info addReviewBtn">Review Register</button>

    <!-- 리뷰 목록 -->
    <div class="list-group reviewList"></div>

      <!-- 페이지 네비게이션 -->
      <div class="pagination">
        <button class="prevPage">Previous</button>
        <span class="pageIndicator"></span>
        <button class="nextPage">Next</button>
    </div>

     <!-- 로그인 여부에 따라 hidden 필드에 값 설정 -->
    <input type="hidden" id="isLoggedIn" th:value="${email != null ? 'true' : 'false'}">
    <input type="hidden" id="isLoginCheck" th:value="${email}">

    <!-- 리뷰 모달 -->
    <div class="reviewModal modal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Movie Review</h5>
                    <button type="button" class="close closeBtn" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Reviewer ID</label>
                        <input type="text" class="form-control" name="email" th:value="${email}" readonly>
                    </div>
                    <div class="form-group" id="divGrade">
                        <label>Grade <span class="grade"></span></label>
                        <div class='starrr'></div>
                    </div>
                    <div class="form-group">
                        <label>Review Text</label>
                        <input type="text" class="form-control" name="text" placeholder="Good Movie!">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary closeBtn" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary reviewSaveBtn">Save changes</button>
                    <button type="button" class="btn btn-warning modifyBtn">Modify</button>
                    <button type="button" class="btn btn-danger removeBtn">Remove</button>
                </div>
            </div>
        </div>
    </div>

    <div class="imageModal modal " tabindex="-2" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Picture</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 사용자 스크립트 추가 -->
    <script th:src="@{/starrr.js}"></script>
    <link th:href="@{/css/starrr.css}" rel="stylesheet">
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.2.0/css/font-awesome.min.css">

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            $(document).ready(function () {

var grade = 0;
var grade2 = 0; // grade2 변수 초기화
var id = [[${ item.id }]];
var reviewnum;

// 리뷰 모달 관련 변수 정의
var reviewModal = $(".reviewModal");
var inputMid = $('input[name="email"]');
var inputText = $('input[name="text"]');

$.ajaxSetup({
    headers: {
        'X-CSRF-TOKEN': $('meta[name="_csrf"]').attr('content')
    }
});

// 리뷰 목록 로드 함수
function loadReviews(page) {
    const itemId = $("#itemId").val();
    $.ajax({
        url: `/reviews/${itemId}/all?page=${page}`,
        type: "GET",
        dataType: "json",
        success: function (data) {
            let reviewHtml = "";
            data.content.forEach(function (review) {
                reviewHtml += `
                    <div class="card-body" data-reviewnum="${review.reviewnum}" data-mid="${review.email}">
                        <h5 class="card-title">${review.text}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">${review.email}</h6>
                        <p class="card-text">${new Date(review.regTime).toLocaleString()}</p>
                        <div class="reviewgrade" data-grade2="${review.grade}"></div>
                    </div>
                `;
            });
            $(".reviewList").html(reviewHtml);
            renderStars(); // 리뷰별점 표시
            currentPage = data.number;
            totalPages = data.totalPages;
            $(".pageIndicator").text(`Page ${currentPage + 1} of ${totalPages}`);
        },
        error: function (xhr) {
            console.error("Error: " + xhr.responseText);
        }
    });
}

// 별점 표시 함수
function renderStars() {
    $(".reviewgrade").each(function () {
        $(this).starrr({
            rating: $(this).data("grade2"),
            readOnly: true
        });
    });
}

// 첫 번째 페이지 로드
loadReviews(0);

// 이전 페이지
$(".prevPage").click(function () {
    if (currentPage > 0) {
        loadReviews(currentPage - 1);
    }
});

// 다음 페이지
$(".nextPage").click(function () {
    if (currentPage < totalPages - 1) {
        loadReviews(currentPage + 1);
    }
});


  //닫기버튼
  $('.closeBtn').click(function () {
                $(this).closest('.modal').modal('hide');
            });

// 리뷰 등록 버튼 클릭
$(".addReviewBtn").click(function () {
    var isLoggedIn = $("#isLoggedIn").val();
    if (isLoggedIn === "false") {
        alert("로그인이 필요합니다. 로그인 페이지로 이동합니다.");
        window.location.href = "/members/login";
    } else {
        grade = 0;
        inputText.val("");
        var star = $(".starrr").clone();
        $(".starrr").remove();
        $("#divGrade").append(star);
        $('.starrr').starrr({
            rating: grade,
            change: function (e, value) {
                if (value) grade = value;
            }
        });
        $(".removeBtn ,  .modifyBtn").hide();
        $(".reviewSaveBtn").show();
        reviewModal.modal('show');
    }
});

// 리뷰 저장 버튼
$('.reviewSaveBtn').click(function () {
    var data = { id: id, grade: grade, text: inputText.val(), email: inputMid.val() };
    $.ajax({
        url: '/reviews/' + id,
        type: "POST",
        data: JSON.stringify(data),
        contentType: "application/json; charset=utf-8",
        dataType: "text",
        success: function () {
            self.location.reload();
        }
    });
    reviewModal.modal('hide');
});

// 리뷰 수정 및 삭제
$(".reviewList").on("click", ".card-body", function () {

    var isLoginCheck = $("#isLoginCheck").val(); 
    var reviewEmail = $(this).data("mid");
    if (isLoginCheck === reviewEmail) {
        $(".reviewSaveBtn").hide();
        $(".removeBtn , .modifyBtn").show();
        reviewModal.modal('show');
    } else {
        alert("본인의 리뷰만 수정할 수 있습니다.");
    }

    var targetReview = $(this);
    reviewnum = targetReview.data("reviewnum");
    inputMid.val(targetReview.data("mid"));
    inputText.val(targetReview.find('.card-title').text().trim());
    grade2 = targetReview.find(".reviewgrade").data("grade2"); // grade2 초기화

    // starrr 초기화
    var star = $(".starrr").clone();
    $(".starrr").remove();
    $("#divGrade").append(star);

    $(".starrr").starrr({
        rating: grade2,
        change: function (e, value) {
            if (value) grade2 = value;
        }
    });
});




// 리뷰 수정 버튼
$(".modifyBtn").on("click", function () {
    var data = { reviewnum: reviewnum, id: id, grade: grade2, text: inputText.val(), email: inputMid.val() };
    $.ajax({
        url: '/reviews/' + id + "/" + reviewnum,
        type: "PUT",
        data: JSON.stringify(data),
        contentType: "application/json; charset=utf-8",
        dataType: "text",
        success: function () {
            self.location.reload();
        }
    });
    reviewModal.modal('hide');
});

// 리뷰 삭제 버튼
$(".removeBtn").on("click", function () {
    var data = { reviewnum: reviewnum };
    $.ajax({
        url: '/reviews/' + id + "/" + reviewnum,
        type: "DELETE",
        contentType: "application/json; charset=utf-8",
        dataType: "text",
        success: function () {
            self.location.reload();
        }
    });
    reviewModal.modal('hide');
});
});

        </script>
    </th:block>
</div>

</html>
