<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link th:href="@{/css/fragments.css}" rel="stylesheet">

</head>

<body>
<div th:fragment="header1" class="hd1">
    <div class="imgcontent">
    </div>

    <nav class="navbar navbar-expand-sm ">
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTogglerDemo03"
                aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <a href="/">
            <img th:src="@{/img/logo_w.png}" />
        </a>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
            <ul class="nav nav-pills">
                <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                    <a class="nav-link" href="/admin/item/new">상품 등록</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                    <a class="nav-link" href="/admin/items">상품 관리</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ROLE_ADMIN')">
                    <a class="nav-link" href="/members/manageMember">회원 관리</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/cart">장바구니<span id="getCount"></span></a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/orders">구매이력</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/members/login">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/members/modify">회원정보수정</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="/members/logout">로그아웃</a>
                </li>
            </ul>
        </div>
        <span sec:authorize="isAuthenticated()"><span  sec:authentication="principal.name"></span>님</span>
        <span sec:authorize="isAuthenticated()" style="display:none;"><span id="ppEmail" sec:authentication="principal.email"></span></span>
        <div class="dropdown dropstart ">
            <button data-bs-toggle="dropdown">
                    <span class="material-symbols-outlined">
                        menu
                        </span>
            </button>
            <ul class="dropdown-menu">
                <li><h5 class="dropdown-header">Dropdown header 1</h5></li>
                <li><a class="dropdown-item" href="#">Link 1</a></li>
                <li><a class="dropdown-item" href="#">Link 2</a></li>
                <li><a class="dropdown-item" href="#">Link 3</a></li>
                <li><h5 class="dropdown-header">Dropdown header 2</h5></li>
                <li><a class="dropdown-item" href="#"><span class="material-symbols-outlined">
                    
                    </span>logout</a></li>
            </ul>
        </div>
    </nav>
</div>

</body>

</html>
